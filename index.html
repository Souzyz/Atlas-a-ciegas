/* ============ Práctica ============ */
let S=null;
function startLevel(id,level,subset){
  const m=BY[id]; const keys=subset||m.parts.map(p=>p.k);
  S={model:id,level,queue:level===1?keys:shuffle(keys),pos:0,total:keys.length,first:0,misses:{},missed:false,revealed:false,requeued:false,phase:'ask',mask:null,subset:!!subset,finished:false};
  renderPlay();
}
function renderPlay(){
  const m=BY[S.model];
  app.innerHTML=`
  <div class="playhead">
    <div><a class="back" href="#inicio">← Todos los modelos</a><h2>${m.title}</h2></div>
    <div class="levels">${[1,2,3].map(l=>`<button type="button" class="lv ${done(m.id,l)?'done':''}" data-lv="${l}" aria-pressed="${S.level===l}"><b>${l}</b>${LEVELS[l].name}</button>`).join('')}</div>
  </div>
  <div class="stage">
    <figure class="fig${m.art?' art':''}" id="fig">${figure(m)}</figure>
    <div class="panel" id="panel"></div>
  </div>`;
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>startLevel(m.id,+b.dataset.lv));
  if(S.finished) renderSummary(); else renderItem();
}
function light(keys){
  const svg=$('#fig svg'); if(!svg) return;
  svg.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  svg.querySelectorAll('.ring').forEach(e=>e.remove());
  keys.forEach(k=>{
    const els=[...svg.querySelectorAll(`[data-part="${k}"]`)];
    els.forEach(e=>e.classList.add('on'));
    const u=svg.viewBox.baseVal.width/420, root=svg.getScreenCTM().inverse();
    if(els.length<=4) els.forEach(e=>{let b; try{b=e.getBoundingClientRect();}catch(x){return;}
      const p0=new DOMPoint(b.left,b.top).matrixTransform(root), p1=new DOMPoint(b.right,b.bottom).matrixTransform(root);
      const d=Math.max(p1.x-p0.x,p1.y-p0.y); if(d>=34*u||d<=0) return;
      const c=document.createElementNS(NS,'circle'); c.setAttribute('class','ring'); c.style.strokeWidth=2.5*u;
      c.setAttribute('cx',(p0.x+p1.x)/2); c.setAttribute('cy',(p0.y+p1.y)/2); c.setAttribute('r',d/2+10*u); svg.appendChild(c);});
  });
}
const cur=()=>BY[S.model].parts.find(p=>p.k===S.queue[S.pos]);
function renderItem(){
  const part=cur(), L=LEVELS[S.level];
  if(S.level===2 && !S.mask) S.mask=maskFor(part.n);
  $('#panel').innerHTML=`
    <div><div class="count"><span>Ronda ${S.level}: ${L.name.toLowerCase()}</span><span>Parte ${S.pos+1} de ${S.queue.length}</span></div>
    <div class="bar"><i style="width:${Math.round(S.pos/S.queue.length*100)}%"></i></div></div>
    <p class="ask">${L.ask}</p>
    <div class="tiles" id="tiles"></div>
    <form id="f" autocomplete="off">
      <label class="sr" for="ans">Nombre de la parte</label>
      <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe aquí" enterkeyhint="done">
      <button class="btn" type="submit" id="go">Revisar</button>
    </form>
    <p class="fb" id="fb" aria-live="polite"></p>
    <p class="note" id="note"></p>
    ${S.level>1?'<div><button class="link" type="button" id="idk">No me acuerdo, muéstramelo</button></div>':''}`;
  $('#f').onsubmit=e=>{e.preventDefault(); submit();};
  const idk=$('#idk'); if(idk) idk.onclick=()=>{ if(S.phase==='ask'){ miss(); $('#ans').focus(); } };
  light([part.k]); paint();
  const a=$('#ans'); try{a.focus({preventScroll:true});}catch(e){a.focus();}
}
function paint(){
  const part=cur(), t=$('#tiles'), fb=$('#fb'), note=$('#note');
  t.className='tiles'; fb.className='fb'; fb.textContent=''; note.textContent='';
  if(Math.max(...part.n.split(' ').map(w=>w.length))>13) t.classList.add('long');
  const idk=$('#idk'); if(idk) idk.hidden=S.revealed||S.phase==='ok';
  if(S.phase==='ok'){ t.classList.add('ok'); t.innerHTML=tilesHTML(part.n); fb.classList.add('good'); fb.textContent='Correcto'; note.textContent=part.t||''; $('#go').textContent='Siguiente'; return; }
  $('#go').textContent='Revisar';
  if(S.level===1){ t.innerHTML=tilesHTML(part.n); note.textContent=part.t||''; if(S.missed){fb.classList.add('bad'); fb.textContent='Casi. Revisa letra por letra y vuelve a escribirlo.';} }
  else if(S.revealed){ t.classList.add('shown'); t.innerHTML=tilesHTML(part.n); fb.classList.add('bad'); fb.textContent='Era este. Escríbelo para continuar; volverá a salir al final de la ronda.'; note.textContent=part.t||''; }
  else if(S.level===2){ t.innerHTML=tilesHTML(part.n,S.mask); }
  else { t.innerHTML='<span class="none">Sin pistas. Escribe el nombre completo.</span>'; }
}
function miss(){
  const k=S.queue[S.pos]; S.misses[k]=(S.misses[k]||0)+1; S.missed=true;
  if(S.level>1){ S.revealed=true; if(!S.requeued){S.queue.push(k); S.requeued=true;} }
  const a=$('#ans'); a.value=''; a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
  paint(); const c=$('.count span:last-child'); if(c) c.textContent=`Parte ${S.pos+1} de ${S.queue.length}`;
}
let timer=null;
function submit(){
  if(S.phase==='ok'){ advance(); return; }
  const a=$('#ans'); if(!a.value.trim()){ a.focus(); return; }
  if(accepts(cur(),a.value)){
    if(!S.misses[S.queue[S.pos]]) S.first++;
    S.phase='ok'; paint();
    clearTimeout(timer); timer=setTimeout(advance, cur().t?1700:1100);
  } else miss();
}
function advance(){
  clearTimeout(timer); if(!S||S.phase!=='ok') return;
  S.pos++; S.phase='ask'; S.missed=false; S.revealed=false; S.requeued=false; S.mask=null;
  if(S.pos>=S.queue.length){ S.finished=true; if(!S.subset){P[S.model]=P[S.model]||{}; P[S.model][S.level]=true; save();} renderPlay(); }
  else renderItem();
}
function renderSummary(){
  const m=BY[S.model], missed=m.parts.filter(p=>S.misses[p.k]);
  const perfect=missed.length===0;
  light(missed.map(p=>p.k));
  let primary='';
  if(S.level<3 && !S.subset) primary=`<button class="btn" type="button" id="nx">Pasar a la ronda ${S.level+1}</button>`;
  else if(!perfect) primary=`<button class="btn" type="button" id="only">Repetir solo las que fallé</button>`;
  else primary=`<a class="btn" href="#inicio">Elegir otro modelo</a>`;
  $('#panel').innerHTML=`
    <p class="ask">Ronda ${S.level} terminada</p>
    <p class="score">${S.first}<small> de ${S.total} a la primera</small></p>
    ${perfect?`<p>${S.level===3?'Este modelo ya lo dominas de memoria.':'Sin errores. Sube de dificultad.'}</p>`
      :`<div><p>Quedaron iluminadas las que fallaste:</p><ul class="missed">${missed.map(p=>`<li>${esc(p.n)}</li>`).join('')}</ul></div>`}
    <div class="actions">${primary}
      <button class="btn ghost" type="button" id="again">Repetir la ronda ${S.level}</button>
      ${primary.includes('#inicio')?'':'<a class="btn ghost" href="#inicio">Otro modelo</a>'}
    </div>`;
  app.querySelectorAll('.lv').forEach(b=>b.classList.toggle('done',done(m.id,+b.dataset.lv)));
  const nx=$('#nx'), only=$('#only');
  if(nx) nx.onclick=()=>startLevel(m.id,S.level+1);
  if(only) only.onclick=()=>startLevel(m.id,S.level,missed.map(p=>p.k));
  $('#again').onclick=()=>startLevel(m.id,S.level);
  const f=nx||only||$('#again'); try{f.focus({preventScroll:true});}catch(e){}
}

/* ============ Cuestionarios ============ */
const QIDS=Object.keys(QUIZ), QN=10, QMIX=3;
const qstat=k=>(P.q&&P.q[k])||[0,0];
const qseen=u=>QUIZ[u].qs.filter((_,i)=>qstat(u+':'+i)[0]>0).length;
const qdue=u=>QUIZ[u].qs.filter((_,i)=>qstat(u+':'+i)[1]).length;
const qtitle=id=>id==='mixto'?'Simulacro mixto':id==='errores'?'Mis errores':QUIZ[id].title;
const qbest=id=>{const b=P.z&&P.z[id]; return b?`Mejor intento: ${b[0]} de ${b[1]}`:'Sin intentos todavía';};
const due=()=>QIDS.flatMap(u=>QUIZ[u].qs.map((_,i)=>({u,i})).filter(x=>qstat(x.u+':'+x.i)[1]));
const ostat=k=>(P.o&&P.o[k])||0;
const oknown=u=>OPEN[u].filter((_,i)=>ostat(u+':'+i)===2).length;
const odue=()=>QIDS.flatMap(u=>OPEN[u].map((_,i)=>({u,i})).filter(x=>ostat(x.u+':'+x.i)===1));
function qcard(id){
  if(id==='mixto'){
    const tot=QIDS.reduce((a,u)=>a+QUIZ[u].qs.length,0);
    return `<div class="card qcard mix"><div><h3>Simulacro mixto</h3><small>Como en el examen: ${QMIX} preguntas de cada tema</small></div>
      <div class="qrows"><a class="qrow" href="#quiz-mixto"><b>Empezar (${QIDS.length*QMIX} preguntas)</b><small>${qbest(id)} · banco de ${tot}</small></a></div></div>`;
  }
  if(id==='errores'){
    const d=due().length, o=odue().length;
    return `<div class="card qcard"><div><h3>Mis errores</h3><small>Todo lo que tienes pendiente, de todos los temas</small></div>
      <div class="qrows">${d?`<a class="qrow" href="#quiz-errores"><b>Opción múltiple</b><small>${d} por repasar</small></a>`:`<div class="qrow off"><b>Opción múltiple</b><small>Nada pendiente</small></div>`}
      ${o?`<a class="qrow" href="#abiertas-errores"><b>Abiertas</b><small>${o} por repasar</small></a>`:`<div class="qrow off"><b>Abiertas</b><small>Nada pendiente</small></div>`}</div></div>`;
  }
  const u=QUIZ[id], n=u.qs.length, seen=qseen(id), d=qdue(id), on=OPEN[id].length, b=P.z&&P.z[id];
  return `<div class="card qcard"><div><h3>${u.title}</h3><small>${u.unit}</small></div>
    <div class="qrows"><a class="qrow" href="#quiz-${id}"><b>Opción múltiple</b><small>Has visto ${seen} de ${n}${b?` · mejor ${b[0]} de ${b[1]}`:''}${d?` · <span class="due">${d} por repasar</span>`:''}</small></a>
    <a class="qrow" href="#abiertas-${id}"><b>Abiertas</b><small>Sabes ${oknown(id)} de ${on}</small></a></div></div>`;
}
/* Rotación: primero las que fallaste la última vez, luego las que no has visto, luego las menos vistas. */
function pickQs(u,n){
  const r=QUIZ[u].qs.map((_,i)=>{const st=qstat(u+':'+i); return {i,rank:st[1]?0:st[0]?1+st[0]:1,t:Math.random()};});
  r.sort((a,b)=>a.rank-b.rank||a.t-b.t);
  return r.slice(0,n).map(x=>({u,i:x.i}));
}
function mkItem(x){
  const o=QUIZ[x.u].qs[x.i][1], n=o.length;
  return {u:x.u,i:x.i,o:n===2?(o[0]==='Verdadero'?[0,1]:[1,0]):shuffle([...Array(n).keys()])};
}
let Z=null;
function startQuiz(id,subset){
  const base=subset||(id==='mixto'?QIDS.flatMap(u=>pickQs(u,QMIX)):id==='errores'?shuffle(due()).slice(0,20):pickQs(id,QN));
  if(!base.length){ location.hash='#inicio'; return; }
  Z={id,items:shuffle(base).map(mkItem),pos:0,pick:null,res:[],subset:!!subset,finished:false};
  renderQuiz(); window.scrollTo(0,0);
}
function renderQuiz(){
  if(Z.finished) return renderQuizEnd();
  const it=Z.items[Z.pos], q=QUIZ[it.u].qs[it.i], n=Z.items.length, ans=Z.pick!==null, ok=ans&&it.o[Z.pick]===0;
  const hits=Z.res.filter(Boolean).length, vf=it.o.length===2;
  app.innerHTML=`
  <div class="playhead">
    <div><a class="back" href="#inicio">← Inicio</a><h2>${Z.subset?'Repaso de las que fallaste':esc(qtitle(Z.id))}</h2></div>
    <p class="qhits">${hits} ${hits===1?'acierto':'aciertos'} de ${Z.res.length}</p>
  </div>
  <div class="qz">
    <div><div class="count"><span>${QUIZ[it.u].unit} · ${QUIZ[it.u].title}</span><span>Pregunta ${Z.pos+1} de ${n}</span></div>
    <div class="bar"><i style="width:${Math.round((Z.pos+(ans?1:0))/n*100)}%"></i></div></div>
    <p class="qtext" id="qt" tabindex="-1">${vf?'¿Verdadero o falso? ':''}${esc(q[0])}</p>
    <div class="opts" role="group" aria-labelledby="qt">${it.o.map((oi,p)=>{
      const right=ans&&oi===0, wrong=ans&&p===Z.pick&&oi!==0;
      return `<button type="button" class="opt${right?' right':''}${wrong?' wrongpick':''}" data-p="${p}"${ans?' disabled':''}><b>${right?'✓':wrong?'✗':'ABCD'[p]}</b><span>${esc(q[1][oi])}</span></button>`;}).join('')}</div>
    <div aria-live="polite">${ans?`<div class="retro ${ok?'good':'bad'}"><p class="fb ${ok?'good':'bad'}">${ok?'Correcto':'Incorrecto'}</p>
      <p>${ok?'':`La respuesta correcta es: <b>${esc(q[1][0])}</b>. `}${esc(q[2])}</p></div>`:''}</div>
    ${ans?`<div class="actions"><button class="btn" type="button" id="qn">${Z.pos+1>=n?'Ver resultado':'Siguiente pregunta'}</button></div>`:''}
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>qpick(+b.dataset.p));
  const nx=$('#qn'); if(nx){ nx.onclick=qnext; try{nx.focus({preventScroll:true});}catch(e){} }
}
function qpick(p){
  if(!Z||Z.finished||Z.pick!==null) return;
  const it=Z.items[Z.pos]; if(p<0||p>=it.o.length) return;
  const ok=it.o[p]===0, k=it.u+':'+it.i, st=qstat(k);
  Z.pick=p; Z.res.push(ok);
  P.q=P.q||{}; P.q[k]=[st[0]+1,ok?0:1]; save();
  renderQuiz();
}
function qnext(){
  if(!Z||Z.pick===null) return;
  Z.pos++; Z.pick=null;
  if(Z.pos>=Z.items.length){
    Z.finished=true;
    if(!Z.subset&&Z.id!=='errores'){ const r=Z.res.filter(Boolean).length, n=Z.items.length, b=P.z&&P.z[Z.id];
      if(!b||r/n>b[0]/b[1]){ P.z=P.z||{}; P.z[Z.id]=[r,n]; save(); } }
  }
  renderQuiz(); window.scrollTo(0,0);
  const t=$('#qt'); if(t) try{t.focus({preventScroll:true});}catch(e){}
}
function renderQuizEnd(){
  const n=Z.items.length, r=Z.res.filter(Boolean).length, bad=Z.items.filter((_,k)=>!Z.res[k]), pct=r/n;
  const msg=bad.length===0?'Sin errores. En el siguiente intento salen preguntas distintas.'
    :pct>=.8?'Muy bien. Lee con calma la explicación de las que fallaste.'
    :pct>=.6?'Vas bien, pero todavía hay huecos. Lee las explicaciones y repasa las que fallaste.'
    :'Este tema necesita otra vuelta a tus apuntes antes de seguir con cuestionarios. Empieza por las explicaciones de abajo.';
  const per=Z.id==='mixto'&&!Z.subset?`<p class="units">${QIDS.map(u=>{const ks=Z.items.map((x,k)=>x.u===u?k:-1).filter(k=>k>=0); return `<span>${QUIZ[u].title} <b>${ks.filter(k=>Z.res[k]).length} de ${ks.length}</b></span>`;}).join('')}</p>`:'';
  const size=Z.id==='mixto'?QIDS.length*QMIX:QN;
  const left=due().length;
  const again=Z.id==='errores'?(left?`<button class="btn ghost" type="button" id="qagain">Seguir con mis errores (${left})</button>`:'')
    :`<button class="btn${bad.length?' ghost':''}" type="button" id="qagain">Otras ${size} preguntas</button>`;
  app.innerHTML=`
  <div class="playhead"><div><a class="back" href="#inicio">← Inicio</a><h2>${Z.subset?'Repaso de las que fallaste':esc(qtitle(Z.id))}</h2></div></div>
  <div class="qz">
    <p class="ask">Resultado</p>
    <p class="score">${r}<small> de ${n} correctas</small></p>
    <p>${msg}</p>${per}
    <div class="actions">${bad.length?'<button class="btn" type="button" id="qfail">Repasar las que fallé</button>':''}${again}<a class="btn ghost" href="#inicio">Volver al inicio</a></div>
    ${bad.length?`<h3>Las que fallaste</h3><ol class="fails">${bad.map(x=>{const q=QUIZ[x.u].qs[x.i]; return `<li><p class="fq">${esc(q[0])}</p><p>Respuesta: <b>${esc(q[1][0])}</b></p><p class="note">${esc(q[2])}</p></li>`;}).join('')}</ol>`:''}
  </div>`;
  const id=Z.id, qf=$('#qfail');
  if(qf) qf.onclick=()=>startQuiz(id,bad.map(x=>({u:x.u,i:x.i})));
  const qa=$('#qagain'); if(qa) qa.onclick=()=>startQuiz(id);
  try{(qf||qa).focus({preventScroll:true});}catch(e){}
}
document.addEventListener('keydown',e=>{
  if(!Z||Z.finished||Z.pick!==null||e.ctrlKey||e.metaKey||e.altKey) return;
  if(!(location.hash||'').startsWith('#quiz-')) return;
  const p='abcd'.indexOf(e.key.toLowerCase()), d='1234'.indexOf(e.key);
  if(p>=0||d>=0){ e.preventDefault(); qpick(p>=0?p:d); }
});

/* ============ Preguntas abiertas ============ */
let Y=null;
const otitle=id=>id==='errores'?'Mis errores':QUIZ[id].title;
function startOpen(id,subset){
  let items=subset;
  if(!items){
    if(id==='errores') items=odue();
    else { const all=OPEN[id].map((_,i)=>({u:id,i})); items=all.filter(x=>ostat(x.u+':'+x.i)!==2); if(!items.length) items=all; }
  }
  if(!items.length){ location.hash='#inicio'; return; }
  Y={id,items,pos:0,total:items.length,shown:false,text:'',first:0,miss:{},finished:false};
  renderOpen(); window.scrollTo(0,0);
}
function renderOpen(){
  if(Y.finished) return renderOpenEnd();
  const it=Y.items[Y.pos], q=OPEN[it.u][it.i], n=Y.items.length;
  const ansHTML=q[1].length>1?`<ul>${q[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p>${esc(q[1][0])}</p>`;
  app.innerHTML=`
  <div class="playhead">
    <div><a class="back" href="#inicio">← Inicio</a><h2>Abiertas: ${esc(otitle(Y.id))}</h2></div>
    <p class="qhits">Sabías ${Y.first} de ${Math.min(Y.pos,Y.total)}</p>
  </div>
  <div class="qz">
    <div><div class="count"><span>${QUIZ[it.u].unit} · ${QUIZ[it.u].title}</span><span>Pregunta ${Y.pos+1} de ${n}</span></div>
    <div class="bar"><i style="width:${Math.round(Y.pos/n*100)}%"></i></div></div>
    <p class="qtext" id="qt" tabindex="-1">${esc(q[0])}</p>
    ${Y.shown?`
      ${Y.text.trim()?`<div class="mine"><p class="cap">Lo que escribiste</p>${esc(Y.text.trim())}</div>`:''}
      <div class="retro model" id="model" tabindex="-1"><p class="cap">Respuesta</p>${ansHTML}${q[2]?`<p class="warn"><b>Ojo:</b> ${esc(q[2])}</p>`:''}</div>
      <p><b>¿La sabías completa?</b> Sé estricto: si te faltó algo, vuelve a salir al final.</p>
      <div class="actions"><button class="btn" type="button" id="knew">Sí, la sabía</button><button class="btn ghost" type="button" id="nope">Me faltó algo</button></div>`
    :`
      <p class="note">Contéstala de memoria: en voz alta, en tu hoja o aquí abajo. Nadie la califica; tú comparas con la respuesta.</p>
      <label class="sr" for="mine">Tu respuesta (opcional)</label>
      <textarea id="mine" rows="3" placeholder="Tu respuesta (opcional)" autocomplete="off" spellcheck="false"></textarea>
      <div class="actions"><button class="btn" type="button" id="show">Ver la respuesta</button></div>`}
  </div>`;
  if(Y.shown){
    $('#knew').onclick=()=>ograde(true); $('#nope').onclick=()=>ograde(false);
    try{$('#model').focus({preventScroll:true});}catch(e){}
  } else {
    const ta=$('#mine'); ta.value=Y.text; ta.oninput=()=>{Y.text=ta.value;};
    ta.onkeydown=e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); oshow(); } };
    $('#show').onclick=oshow;
  }
}
function oshow(){ if(!Y||Y.shown) return; Y.shown=true; renderOpen(); }
function ograde(ok){
  if(!Y||!Y.shown) return;
  const it=Y.items[Y.pos], k=it.u+':'+it.i;
  P.o=P.o||{}; P.o[k]=ok?2:1; save();
  if(Y.pos<Y.total){ if(ok) Y.first++; else { Y.miss[k]=1; Y.items.push({u:it.u,i:it.i}); } }
  Y.pos++; Y.shown=false; Y.text='';
  if(Y.pos>=Y.items.length) Y.finished=true;
  renderOpen(); window.scrollTo(0,0);
  const t=$('#qt'); if(t) try{t.focus({preventScroll:true});}catch(e){}
}
function renderOpenEnd(){
  const id=Y.id, bad=Y.items.slice(0,Y.total).filter(x=>Y.miss[x.u+':'+x.i]);
  const still=bad.filter(x=>ostat(x.u+':'+x.i)===1);
  const unit=id!=='errores';
  app.innerHTML=`
  <div class="playhead"><div><a class="back" href="#inicio">← Inicio</a><h2>Abiertas: ${esc(otitle(id))}</h2></div></div>
  <div class="qz">
    <p class="ask">Vuelta terminada</p>
    <p class="score">${Y.first}<small> de ${Y.total} sabías a la primera</small></p>
    <p>${bad.length===0?'Todas a la primera. Estas ya quedaron marcadas como sabidas.':still.length?'Las que marcaste con «me faltó» siguen pendientes; dales otra vuelta más tarde.':'Las que te faltaron ya las contestaste bien en la segunda vuelta. Repásalas otra vez antes de dormir.'}</p>
    <div class="actions">${bad.length?'<button class="btn" type="button" id="oagain">Repetir las que me faltaron</button>':''}
      ${unit?`<a class="btn${bad.length?' ghost':''}" href="#quiz-${id}">Opción múltiple de este tema</a>`:''}
      ${unit?'<button class="btn ghost" type="button" id="oall">Repetir todas</button>':''}
      <a class="btn ghost" href="#inicio">Volver al inicio</a></div>
    ${bad.length?`<h3>Las que te faltaron</h3><ol class="fails">${bad.map(x=>{const q=OPEN[x.u][x.i]; return `<li><p class="fq">${esc(q[0])}</p><p class="note">${esc(q[1].join(' · '))}</p></li>`;}).join('')}</ol>`:''}
  </div>`;
  const oa=$('#oagain'), ol=$('#oall');
  if(oa) oa.onclick=()=>startOpen(id,bad.map(x=>({u:x.u,i:x.i})));
  if(ol) ol.onclick=()=>startOpen(id,OPEN[id].map((_,i)=>({u:id,i})));
}
document.addEventListener('keydown',e=>{
  if(!Y||Y.finished||!Y.shown||e.ctrlKey||e.metaKey||e.altKey) return;
  if(!(location.hash||'').startsWith('#abiertas-')) return;
  if(e.key==='1'){ e.preventDefault(); ograde(true); } else if(e.key==='2'){ e.preventDefault(); ograde(false); }
});

/* ============ Rutas y arranque ============ */
function route(){
  clearTimeout(timer);
  const h=(location.hash||'').slice(1), m=BY[h];
  const qid=h.startsWith('quiz-')?h.slice(5):null, oid=h.startsWith('abiertas-')?h.slice(9):null;
  if(qid&&(qid==='mixto'||qid==='errores'||QUIZ[qid])){ S=null; Y=null; if(Z&&Z.id===qid) renderQuiz(); else startQuiz(qid); }
  else if(oid&&(oid==='errores'||OPEN[oid])){ S=null; Z=null; if(Y&&Y.id===oid) renderOpen(); else startOpen(oid); }
  else if(m){ Z=null; Y=null; if(S&&S.model===m.id) renderPlay(); else startLevel(m.id,nextLevel(m.id)); }
  else { S=null; Z=null; Y=null; renderHome(); }
  window.scrollTo(0,0);
}
function start(data){
  if(data&&data.S&&BY[data.S.model]&&(location.hash||'').slice(1)===data.S.model){ S=data.S; if(S.phase==='ok') S.phase='ask'; }
  if(data&&data.Z&&Array.isArray(data.Z.items)&&(location.hash||'').slice(1)==='quiz-'+data.Z.id
     &&data.Z.items.every(x=>QUIZ[x.u]&&QUIZ[x.u].qs[x.i]&&x.o.length===QUIZ[x.u].qs[x.i][1].length)) Z=data.Z;
  if(data&&data.Y&&Array.isArray(data.Y.items)&&(location.hash||'').slice(1)==='abiertas-'+data.Y.id&&data.Y.items.every(x=>OPEN[x.u]&&OPEN[x.u][x.i])) Y=data.Y;
  route();
  window.addEventListener('hashchange',route);
}
try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S,Z,Y})); }catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
