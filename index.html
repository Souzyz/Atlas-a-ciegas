<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas a ciegas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Plan: una mesa de luz de anatomía. Todo es frío y callado (papel azul grisáceo, tinta petróleo)
   y lo único cálido es la parte iluminada. Títulos condensados como etiquetas de espécimen;
   texto en una letra hecha para distinguir caracteres, porque aquí se practica ortografía. */
:root{
  --ground:#E7EDF0; --surface:#F6F9FA; --ink:#10222F; --ink-soft:#4B6273; --rule:#C2CFD7;
  --part:#BDCCD6; --part2:#D6E0E6; --part3:#9DB2C0; --tube:#8AA2B2; --tube2:#B5C6D1; --line:#3B5465; --ctx:#DCE5EA;
  --hl:#FF6A13; --hl-glow:rgba(255,106,19,.55);
  --accent:#0E5C7A; --on-accent:#F6F9FA; --good:#127A55; --bad:#BF3049;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0A151E; --surface:#11212D; --ink:#E6EFF4; --ink-soft:#9BB2C0; --rule:#26404F;
    --part:#36525F; --part2:#28414E; --part3:#4D6E80; --tube:#557789; --tube2:#3A5767; --line:#93B3C4; --ctx:#182D3A;
    --hl:#FFB02E; --hl-glow:rgba(255,176,46,.6);
    --accent:#5CC4E6; --on-accent:#06202B; --good:#3DD6A0; --bad:#FF7088;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0A151E; --surface:#11212D; --ink:#E6EFF4; --ink-soft:#9BB2C0; --rule:#26404F;
  --part:#36525F; --part2:#28414E; --part3:#4D6E80; --tube:#557789; --tube2:#3A5767; --line:#93B3C4; --ctx:#182D3A;
  --hl:#FFB02E; --hl-glow:rgba(255,176,46,.6);
  --accent:#5CC4E6; --on-accent:#06202B; --good:#3DD6A0; --bad:#FF7088;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-weight:800;font-size:clamp(44px,8vw,76px)}
h2{font-weight:800;font-size:30px}
h3{font-weight:600;font-size:21px;letter-spacing:.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:end;padding:8px 0 28px;border-bottom:2px solid var(--ink)}
.hero .lede{max-width:46ch;margin-top:14px;color:var(--ink-soft);font-size:17px}
.hero .tally{margin-top:16px;font-weight:700}
.how{display:grid;gap:10px}
.how .row{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center}
.how .lbl{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:17px;letter-spacing:.03em;color:var(--ink-soft)}
.group{margin-top:36px}
.group header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.group header span{color:var(--ink-soft);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:grid;grid-template-rows:150px auto;gap:10px;text-align:left;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .thumb{display:flex;align-items:center;justify-content:center;min-height:0}
.card .thumb svg{max-width:100%;max-height:150px;width:auto;height:100%}
.card .meta{display:flex;justify-content:space-between;align-items:end;gap:8px}
.card small{display:block;color:var(--ink-soft);font-size:13px;margin-top:3px}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.pips i.done{background:var(--hl);border-color:var(--hl)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);color:var(--ink-soft);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- figura ---------- */
.fig{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;justify-content:center}
.fig svg{display:block;width:100%;height:auto;max-height:540px}
svg .ctx{fill:var(--ctx);stroke:none}
svg .ctxs{fill:none;stroke:var(--ctx);stroke-linecap:round;stroke-linejoin:round}
svg .ctxl{fill:none;stroke:var(--line);stroke-width:1;opacity:.45}
svg .crt{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:2 4;stroke-linecap:round;opacity:.55}
svg .hole{fill:var(--surface);stroke:var(--line);stroke-width:1}
svg .dark{fill:var(--line);stroke:none;opacity:.75}
svg .lung{fill:var(--part);stroke:none}
svg .lbl{font:11px var(--body);fill:var(--ink-soft);letter-spacing:.06em}
svg .p{fill:var(--part);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round;transition:fill .18s,stroke .18s}
svg .p.t2{fill:var(--part2)}
svg .p.t3{fill:var(--part3)}
svg .p.ln{fill:none;stroke:var(--tube);stroke-linecap:round;stroke-linejoin:round}
svg .p.ln.t2{stroke:var(--tube2)}
svg .p .l{fill:none;stroke:var(--line);stroke-width:1;stroke-linecap:round}
svg .p.on{fill:var(--hl);stroke:var(--ink);filter:drop-shadow(0 0 6px var(--hl-glow));animation:lit 1.1s ease-in-out infinite alternate}
svg .p.ln.on{fill:none;stroke:var(--hl)}
svg .np{fill:var(--ctx);stroke:var(--line);opacity:.95}
svg .thin .p,svg .thin .np{stroke-width:.45}
svg .a.on:not(.nf):not(.sk),svg .a.on *:not(.nf):not(.sk){fill:var(--hl)!important}
svg .a.on.sk,svg .a.on .sk{stroke:var(--hl)!important}
svg .a.on{filter:drop-shadow(0 0 6px var(--hl-glow));animation:lit 1.1s ease-in-out infinite alternate}
svg .a.ov{opacity:0}
svg .a.ov.on{opacity:1}
svg .a.ov.on *{opacity:1!important;fill-opacity:1!important}
.fig.art,.thumb.art{background:#EFF3F5;--hl:#FF5A0A;--hl-glow:rgba(255,90,10,.6)}
.thumb.art{border-radius:4px}
svg .ring{fill:none;stroke:var(--hl);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out infinite}
@keyframes lit{from{filter:drop-shadow(0 0 2px var(--hl-glow))}to{filter:drop-shadow(0 0 10px var(--hl-glow))}}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.5);opacity:0}}

/* ---------- práctica ---------- */
.playhead{display:flex;align-items:end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.playhead .back{color:var(--accent);font-weight:700;text-underline-offset:3px;display:inline-block;margin-bottom:8px}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{background:transparent;border:1.5px solid var(--rule);border-radius:4px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:8px;font-size:15px}
.lv b{font-family:var(--display);font-size:20px;line-height:1;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--ctx)}
.lv.done b{background:var(--hl);color:#10222F}
.lv[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:700}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.count{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft)}
.bar{height:6px;background:var(--ctx);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hl);transition:width .25s}
.ask{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:24px;line-height:1.05}
.tiles{display:flex;flex-wrap:wrap;gap:6px 16px;min-height:42px;align-items:center}
.tiles .w{display:flex;gap:3px;max-width:100%}
.tile{width:26px;flex:0 1 auto;min-width:0;height:38px;display:grid;place-items:center;font-weight:700;font-size:20px;text-transform:uppercase;border-bottom:3px solid var(--ink);background:var(--surface)}
.tile.gap{background:transparent;border-bottom-style:dashed;border-bottom-color:var(--line)}
.tiles.ok .tile{border-bottom-color:var(--good);color:var(--good)}
.tiles.shown .tile{border-bottom-color:var(--hl)}
.tiles.long .tile{font-size:14px}
.tiles .none{color:var(--ink-soft);font-size:15px}
.how .tile{width:20px;height:30px;font-size:15px;border-bottom-width:2px}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:700 20px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:11px 12px}
input[type=text]::placeholder{color:var(--ink-soft);font-weight:400;opacity:.7}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:12px 18px;font-weight:700;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.fb{min-height:24px;font-weight:700}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.note{color:var(--ink-soft);font-size:15px;border-left:3px solid var(--rule);padding-left:10px}
.note:empty{display:none}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.score{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9}
.score small{font-size:24px;font-weight:600;color:var(--ink-soft)}
.missed{margin:0;padding-left:20px}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- cuestionarios ---------- */
.card.qcard{grid-template-rows:auto auto;gap:14px;align-content:space-between;padding:14px}
.card.qcard.mix{border:2px solid var(--ink)}
.qmeta{display:grid;gap:5px}
.qmeta small{margin:0}
.qmeta .due{color:var(--bad);font-weight:700}
.qz{max-width:720px;display:grid;gap:16px}
.qtext{font-size:22px;font-weight:700;line-height:1.3;text-wrap:pretty}
.qtext:focus{outline:none}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:6px;padding:12px 14px;font-size:17px;line-height:1.35;color:var(--ink);transition:border-color .12s}
.opt b{font-family:var(--display);font-size:19px;line-height:1;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--ctx)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default;color:var(--ink-soft)}
.opt.right{border-color:var(--good);border-width:2px;color:var(--ink);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.right b{background:var(--good);color:var(--surface)}
.opt.wrongpick{border-color:var(--bad);border-width:2px;color:var(--ink);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.wrongpick b{background:var(--bad);color:var(--surface)}
.retro{border-left:4px solid var(--rule);background:var(--surface);padding:12px 14px;border-radius:0 6px 6px 0;display:grid;gap:4px}
.retro.good{border-left-color:var(--good)} .retro.bad{border-left-color:var(--bad)}
.retro .fb{min-height:0}
.qhits{font-weight:700;color:var(--ink-soft)}

.card.qcard{cursor:default}
.card.qcard:hover{transform:none;border-color:var(--rule)}
.card.qcard.mix:hover{border-color:var(--ink)}
.qrows{display:grid;gap:8px}
.qrow{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--rule);border-radius:5px;padding:9px 11px;transition:border-color .12s,background .12s}
a.qrow:hover{border-color:var(--ink);background:var(--ground)}
.qrow b{display:flex;justify-content:space-between;gap:8px;color:var(--accent)}
.qrow b::after{content:"→"}
.qrow.off{border-style:dashed}
.qrow.off b{color:var(--ink-soft)} .qrow.off b::after{content:""}
.qrow small{margin-top:2px}
textarea{width:100%;font:17px/1.4 var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;resize:vertical;min-height:84px}
textarea::placeholder{color:var(--ink-soft);opacity:.75}
.mine{border:1.5px dashed var(--rule);border-radius:6px;padding:10px 14px;white-space:pre-wrap}
.cap{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.retro ul{margin:0;padding-left:20px;display:grid;gap:3px}
.retro.model{border-left-color:var(--accent)}
.retro:focus{outline:none}
.warn{margin-top:6px;padding-top:8px;border-top:1px solid var(--rule);color:var(--ink-soft);font-size:15px}
.warn b{color:var(--bad)}
.fails{margin:0;padding-left:22px;display:grid;gap:16px}
.fails li p+p{margin-top:4px}
.fails .fq{font-weight:700}
.units{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--ink-soft)}
.units b{color:var(--ink)}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:20px}
  .stage{grid-template-columns:minmax(0,1fr);gap:16px}
  .fig{padding:8px}
  .fig svg{max-height:300px}
  .ask{font-size:21px}
  .qtext{font-size:19px}
  .opt{font-size:16px;padding:11px 12px}
  .wrap{padding:16px 16px 48px}
}
@media (prefers-reduced-motion: reduce){
  svg .p.on,svg .ring,.shake{animation:none}
  .card,.bar i{transition:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ============ Dibujos (esquemas propios) ============ */
function svgColumna(){
  let o='', y=28;
  const seg=(n,h,w0,w1,amp,key)=>{
    for(let i=0;i<n;i++){
      const u=(i+.5)/n, cx=118+amp*Math.sin(Math.PI*u), w=w0+(w1-w0)*u, x=(cx-w/2).toFixed(1);
      o+=`<g class="p" data-part="${key}"><path d="M${x} ${(y+2).toFixed(1)} l-13 ${(h*.75).toFixed(1)} l13 -3z"/><rect x="${x}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(h-2.5).toFixed(1)}" rx="3"/></g>`;
      y+=h;
    }
  };
  seg(7,11.5,24,27,9,'cervicales'); seg(12,15,29,36,-20,'toracicas'); seg(5,21,40,44,14,'lumbares');
  o+=`<path class="p t2" data-part="sacro" d="M96 394 L140 394 Q138 426 103 449 Q90 420 96 394Z"/>`;
  o+=`<path class="p t3" data-part="coccix" d="M98 452 L108 449 L120 467 Q113 474 108 465Z"/>`;
  o+=`<text class="lbl" x="158" y="474">anterior →</text>`;
  return o;
}
function svgTorax(){
  let o='<rect class="ctx" x="171" y="16" width="18" height="284" rx="7"/>';
  const rib=(s,yp,ya,w,xa,key)=>{const X=v=>(180+s*v).toFixed(1);
    return `<path class="ctxs" style="stroke-width:5" d="M${X(6)} ${yp} C${X(w*.6)} ${yp-14} ${X(w)} ${yp+4} ${X(w)} ${(yp+ya)/2+6}"/>`+
      `<path class="p ln" data-part="${key}" style="stroke-width:6" d="M${X(w)} ${(yp+ya)/2+6} C${X(w)} ${ya+22} ${X(w*.45)} ${ya+16} ${X(xa)} ${ya}"/>`;};
  const T=[[30,52,46,20],[46,76,64,16],[64,100,80,16],[82,126,94,16],[100,152,104,16],[120,178,112,16],[140,206,118,16]];
  const F=[[162,232,120,34],[184,250,116,50],[206,266,110,66]];
  [-1,1].forEach(s=>{const X=v=>(180+s*v).toFixed(1);
    o+=`<path class="p ln" data-part="flotantes" style="stroke-width:6" d="M${X(6)} 250 Q${X(50)} 250 ${X(70)} 282"/>`;
    o+=`<path class="p ln" data-part="flotantes" style="stroke-width:6" d="M${X(6)} 228 Q${X(60)} 226 ${X(88)} 264"/>`;
    for(let i=F.length-1;i>=0;i--) o+=rib(s,...F[i],'falsas');
    o+=`<path class="crt" d="M${X(34)} 232 Q${X(24)} 226 ${X(15)} 226"/><path class="crt" d="M${X(50)} 250 Q${X(41)} 240 ${X(35)} 235"/><path class="crt" d="M${X(66)} 266 Q${X(57)} 256 ${X(51)} 253"/>`;
    for(let i=T.length-1;i>=0;i--) o+=rib(s,...T[i],'verdaderas');
  });
  o+=`<path class="p" data-part="manubrio" d="M156 38 L204 38 L197 72 L163 72Z"/>`;
  o+=`<path class="p t2" data-part="cuerpo" d="M165 74 L195 74 L193 230 Q180 238 167 230Z"/>`;
  o+=`<path class="p t3" data-part="xifoides" d="M172 239 L188 239 L180 268Z"/>`;
  return o;
}
function svgCapas(){
  const cx=210, cy=196; let o=`<circle class="ctx" cx="${cx}" cy="${cy}" r="150"/>`;
  [-90,30,150].forEach(a=>{
    const fx=cx+80*Math.cos(a*Math.PI/180), fy=cy+80*Math.sin(a*Math.PI/180);
    o+=`<circle class="p t2" data-part="fasciculo" cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="58"/>`;
    const pts=[[0,0]]; for(let k=0;k<6;k++) pts.push([34*Math.cos(k*Math.PI/3),34*Math.sin(k*Math.PI/3)]);
    pts.forEach(([dx,dy])=>{const x=(fx+dx).toFixed(1), yv=(fy+dy).toFixed(1);
      o+=`<circle class="p t3" data-part="fibra" cx="${x}" cy="${yv}" r="12"/><circle class="p ln" data-part="endomisio" cx="${x}" cy="${yv}" r="14" style="stroke-width:4"/>`;});
    o+=`<circle class="p ln" data-part="perimisio" cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="58" style="stroke-width:7"/>`;
  });
  o+=`<circle class="p ln" data-part="epimisio" cx="${cx}" cy="${cy}" r="150" style="stroke-width:11"/>`;
  o+=`<text class="lbl" x="210" y="384" text-anchor="middle">corte transversal de un músculo</text>`;
  return o;
}
function chev(x1,y1,x2,y2){let d=`M${x1} ${y1} L${x2} ${y2}`;
  for(let t=.14;t<.9;t+=.15){const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t; d+=` M${(x-9).toFixed(1)} ${(y-11).toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)} L${(x+9).toFixed(1)} ${(y-11).toFixed(1)}`;}
  return `<path class="l" d="${d}"/>`;}
function svgFasciculos(){
  let o='';
  o+=`<g class="p" data-part="paralelo"><rect x="40" y="30" width="40" height="132" rx="6"/><path class="l" d="M48 36 V156 M56 36 V156 M64 36 V156 M72 36 V156"/></g>`;
  o+=`<g class="p" data-part="fusiforme"><path d="M165 24 Q204 96 165 168 Q126 96 165 24Z"/><path class="l" d="M165 30 V162 M165 34 Q186 96 165 158 M165 34 Q144 96 165 158"/></g>`;
  o+=`<g class="p" data-part="triangular"><path d="M233 38 Q275 20 317 38 L283 162 L267 162Z"/><path class="l" d="M245 38 L270 158 M260 33 L273 158 M275 31 V158 M290 33 L277 158 M305 38 L280 158"/></g>`;
  let u=''; for(let y=57;y<=142;y+=17) u+=` M358 ${y} L390 ${y+16}`;
  o+=`<g class="p" data-part="unipeniforme"><path d="M358 40 L391 57 L391 160 L358 143Z"/><path class="l" d="${u.trim()}"/><path class="l" style="stroke-width:4" d="M392 22 V174"/></g>`;
  let b=''; for(let y=249;y<=315;y+=16.5) b+=` M76 ${y} L110 ${y+17} L144 ${y}`;

const QUIZ={"resp":{"title":"Respiratorio","unit":"Unidad 5","qs":[["¿Qué región de la faringe solo deja pasar aire?",["Nasofaringe","Bucofaringe","Laringofaringe","Las tres por igual"],"Por la nasofaringe solo pasa aire. Por la bucofaringe y la laringofaringe pasan aire y alimento."],["¿Qué estructura de la laringe produce la voz?",["Los pliegues vocales","La epiglotis","Los pliegues ventriculares","El cartílago cricoides"],"Los pliegues vocales (cuerdas verdaderas) vibran y producen la voz. Los ventriculares son las cuerdas falsas."],["Al tragar, ¿qué estructura tapa la entrada de la laringe?",["La epiglotis","El cartílago tiroides","La úvula","La carina"],"La epiglotis baja y tapa la laringe para que el bolo no entre a la vía aérea."],["¿Cómo son los cartílagos de la tráquea?",["16 a 20 anillos de cartílago hialino en forma de C","Anillos completos de cartílago elástico","Placas sueltas de fibrocartílago","9 cartílagos: 3 impares y 3 pares"],"Son 16 a 20 anillos de cartílago hialino en forma de C. Los 9 cartílagos son de la laringe."],["¿Para qué sirve que los anillos de la tráquea estén abiertos por detrás (forma de C)?",["Para que el esófago pueda expandirse al tragar","Para que entre más aire","Para producir la voz","Para que la tráquea pueda cerrarse por completo"],"La parte abierta mira al esófago y la cierra el músculo traqueal; así el esófago se expande cuando pasa el bolo."],["¿Por qué un objeto aspirado suele irse al bronquio derecho?",["Porque es más vertical, corto y ancho","Porque es más largo y delgado","Porque tiene más cilios","Porque el izquierdo está tapado por el corazón"],"El bronquio principal derecho es más vertical, corto y ancho que el izquierdo."],["¿Dónde termina la porción conductora de las vías respiratorias?",["En los bronquiolos terminales","En los bronquios lobares","En los conductos alveolares","En los alvéolos"],"Hasta los bronquiolos terminales solo se conduce aire. Desde los bronquiolos respiratorios ya hay intercambio."],["¿En qué estructura empieza el intercambio de gases?",["En los bronquiolos respiratorios","En los bronquiolos terminales","En los bronquios segmentarios","En la tráquea"],"Los bronquiolos respiratorios ya tienen algunos alvéolos en su pared."],["¿Cuál es el orden correcto del árbol bronquial?",["Tráquea, bronquio principal, lobar, segmentario, bronquiolo","Tráquea, bronquio lobar, principal, segmentario, bronquiolo","Tráquea, bronquiolo, bronquio principal, lobar, segmentario","Tráquea, bronquio segmentario, lobar, principal, bronquiolo"],"Principal (uno por pulmón), lobar (uno por lóbulo), segmentario y luego los bronquiolos."],["¿Cuántos lóbulos tiene cada pulmón?",["Derecho 3, izquierdo 2","Derecho 2, izquierdo 3","Los dos tienen 3","Los dos tienen 2"],"El derecho tiene 3 lóbulos (superior, medio e inferior); el izquierdo, 2."],["¿Qué tiene el pulmón izquierdo que no tiene el derecho?",["La incisura cardíaca","El lóbulo medio","La fisura horizontal","Tres lóbulos"],"La incisura cardíaca es el hueco para el corazón. El lóbulo medio y la fisura horizontal son del derecho."],["¿Qué hacen las células alveolares tipo II?",["Secretan surfactante, que evita que el alvéolo se colapse","Hacen el intercambio de gases","Se comen el polvo y los microbios","Producen moco"],"Tipo I: intercambio. Tipo II: surfactante. Los macrófagos alveolares limpian."],["¿En qué células del alvéolo ocurre el intercambio de gases?",["En las células tipo I","En las células tipo II","En los macrófagos alveolares","En las células caliciformes"],"Las tipo I son planas y delgadísimas; por ahí cruzan los gases."],["¿Cuáles son las capas que rodean al pulmón, de adentro hacia afuera?",["Pleura visceral, cavidad pleural, pleura parietal","Pleura parietal, cavidad pleural, pleura visceral","Pleura visceral, pleura parietal, cavidad pleural","Pericardio, pleura visceral, diafragma"],"La visceral está pegada al pulmón; la parietal tapiza la pared del tórax; entre ellas queda la cavidad pleural."],["¿Qué contiene la cavidad pleural y para qué sirve?",["Líquido pleural, que reduce la fricción","Aire, que mantiene inflado el pulmón","Surfactante, que evita el colapso","Sangre, que nutre al pulmón"],"El líquido pleural lubrica y mantiene pegadas las dos pleuras."],["¿Cuál de estas NO es función del sistema respiratorio?",["Producir glóbulos rojos","Regular el pH de la sangre","Contener los receptores del olfato","Producir sonidos"],"Sus funciones: intercambio de gases, regular el pH, olfato, filtrar el aire, producir sonidos y eliminar algo de agua y calor."],["¿Qué es el volumen corriente?",["El aire de una respiración normal (unos 500 mL)","El aire que queda después de espirar fuerte","Todo el aire que cabe en los pulmones","El aire extra que metes al inspirar fuerte"],"Volumen corriente: lo que entra y sale en una respiración tranquila, unos 500 mL."],["¿Qué volúmenes suma la capacidad vital?",["Reserva inspiratoria, corriente y reserva espiratoria","Corriente y residual","Reserva espiratoria y residual","Los cuatro volúmenes"],"Es todo el aire que puedes mover: todo menos el volumen residual. Los cuatro volúmenes son la capacidad pulmonar total."],["¿Qué es la capacidad residual funcional?",["Reserva espiratoria más volumen residual","Corriente más reserva inspiratoria","Solo el volumen residual","Reserva inspiratoria más reserva espiratoria"],"Es el aire que queda en los pulmones después de una espiración normal."],["¿Qué es la capacidad inspiratoria?",["Volumen corriente más reserva inspiratoria","Reserva espiratoria más residual","Los cuatro volúmenes","Corriente más residual"],"Es todo lo que puedes inspirar partiendo de una espiración normal."],["¿Qué volumen NO se puede medir con un espirómetro?",["El volumen residual","El volumen corriente","La reserva inspiratoria","La reserva espiratoria"],"El residual siempre se queda en el pulmón, nunca sale, así que el espirómetro no lo registra."],["¿Cuál es la diferencia entre un volumen y una capacidad pulmonar?",["La capacidad es la suma de dos o más volúmenes","El volumen es la suma de dos o más capacidades","Son lo mismo","El volumen se mide en reposo y la capacidad en ejercicio"],"Hay 4 volúmenes; las capacidades se obtienen sumándolos."],["Una persona tiene: corriente 500 mL, reserva inspiratoria 3000, reserva espiratoria 1000 y residual 1200. ¿Cuál es su capacidad vital?",["4500 mL","5700 mL","3500 mL","2200 mL"],"3000 + 500 + 1000 = 4500 mL. El residual no entra. 5700 sería la capacidad pulmonar total."],["¿Cuál es el principal músculo de la inspiración y cómo es la espiración en reposo?",["Diafragma; la espiración es pasiva","Intercostales internos; la espiración es activa","Esternocleidomastoideo; la espiración es pasiva","Diafragma; la espiración usa los abdominales"],"En reposo solo trabaja la inspiración; al relajarse el diafragma el pulmón regresa solo."],["¿Qué parte del encéfalo controla la respiración?",["El bulbo raquídeo, con ayuda de la protuberancia","El cerebelo","El hipotálamo","La corteza motora"],"El centro respiratorio está en el tronco encefálico: bulbo raquídeo y protuberancia."],["¿Dónde están los quimiorreceptores periféricos?",["En los cuerpos carotídeos y aórticos","En el bulbo raquídeo","En los alvéolos","En el diafragma"],"Los periféricos están en la carótida y la aorta; los centrales, en el bulbo raquídeo."],["Si sube el CO₂ y baja el pH de la sangre, ¿cómo responde el centro respiratorio?",["Aumenta la frecuencia y la profundidad de la respiración","Disminuye la frecuencia respiratoria","Detiene la respiración unos segundos","No cambia nada"],"Los quimiorreceptores avisan al centro respiratorio y se respira más rápido y profundo para sacar el CO₂."],["¿Qué función del sistema respiratorio ayuda a mantener la homeostasis?",["Elimina CO₂ y así regula el pH de la sangre","Produce calor","Absorbe nutrientes","Filtra la sangre"],"Al eliminar CO₂ mantiene el pH de la sangre dentro de lo normal."],["¿Dónde ocurre el intercambio gaseoso y por qué mecanismo?",["Entre los alvéolos y los capilares, por difusión","En la tráquea, por transporte activo","En los bronquios, por ósmosis","En la pleura, por filtración"],"Los gases difunden de donde hay más a donde hay menos: el O₂ pasa a la sangre y el CO₂ al alvéolo."],["¿Cómo viaja la mayor parte del oxígeno en la sangre?",["Unido a la hemoglobina","Disuelto en el plasma","Como bicarbonato","Unido a la albúmina"],"El 98.5 % del O₂ viaja unido a la hemoglobina. El CO₂ viaja sobre todo como bicarbonato (70 %)."],["¿Qué diferencia hay entre respiración externa e interna?",["Externa: alvéolo y sangre. Interna: sangre y tejidos","Externa: nariz y faringe. Interna: tráquea y bronquios","Externa: inspirar. Interna: espirar","Externa: sangre y tejidos. Interna: alvéolo y sangre"],"En la externa la sangre gana O₂ en el pulmón; en la interna lo entrega a los tejidos."]]},"dig":{"title":"Digestivo","unit":"Unidad 6","qs":[["¿Cuál de estos es un órgano accesorio (la comida no pasa por él)?",["El páncreas","El esófago","El estómago","El intestino grueso"],"Accesorios: dientes, lengua, glándulas salivales, hígado, vesícula biliar y páncreas."],["¿Cuál lista tiene solo órganos del tubo digestivo?",["Faringe, esófago, estómago, intestino delgado","Boca, esófago, hígado, estómago","Lengua, estómago, páncreas, recto","Esófago, vesícula biliar, intestino grueso, ano"],"Tubo digestivo: boca, faringe, esófago, estómago, intestino delgado, intestino grueso, recto y ano."],["¿Cuáles son los dos mecanismos de la digestión?",["Mecánica y química","Absorción y excreción","Voluntaria e involuntaria","Aerobia y anaerobia"],"Mecánica: masticar, mezclar, peristalsis. Química: enzimas que rompen moléculas."],["¿Dónde empieza la digestión química y con qué enzima?",["En la boca, con la amilasa salival","En el estómago, con la pepsina","En el intestino delgado, con la lipasa","En el esófago, con la amilasa"],"La amilasa salival empieza a romper el almidón desde la boca."],["¿En qué parte del tubo digestivo hay digestión mecánica pero no química?",["En el esófago","En la boca","En el estómago","En el intestino delgado"],"El esófago solo transporta: secreta moco y mueve el bolo por peristalsis."],["¿Cuál fase de la deglución es voluntaria?",["La bucal","La faríngea","La esofágica","Las tres"],"En la fase bucal la lengua empuja el bolo. La faríngea y la esofágica son involuntarias."],["En la fase faríngea, ¿qué evita que el bolo se vaya hacia la nariz?",["El paladar blando y la úvula","La epiglotis","La lengua","El esfínter esofágico superior"],"El paladar blando sube y cierra la nasofaringe. La epiglotis tapa la laringe."],["¿Cómo baja el bolo por el esófago hasta el estómago?",["Por peristalsis","Solo por gravedad","Por difusión","Por la presión de la lengua"],"El peristaltismo son ondas de contracción del músculo que empujan el bolo."],["¿Cuántos dientes deciduos (de leche) hay y cuáles son?",["20: 8 incisivos, 4 caninos y 8 molares","20: 8 incisivos, 8 caninos y 4 molares","32: 8 incisivos, 4 caninos, 8 premolares y 12 molares","28: 8 incisivos, 4 caninos y 16 molares"],"Son 20 y no tienen premolares. El cuestionario del grupo trae caninos y molares al revés."],["¿Cuántos dientes permanentes tiene un adulto?",["32","20","28","36"],"32: 8 incisivos, 4 caninos, 8 premolares y 12 molares."],["¿Qué evita que el contenido del estómago regrese al esófago?",["El esfínter esofágico inferior","El esfínter pilórico","La válvula ileocecal","La epiglotis"],"El pilórico está entre estómago y duodeno; el ileocecal, entre intestino delgado y grueso."],["¿Cómo se llama el bolo ya mezclado con el jugo gástrico?",["Quimo","Quilo","Bilis","Bolo fecal"],"En el estómago el bolo se convierte en quimo."],["¿Qué hace el HCl en el estómago?",["Mata microbios, desnaturaliza proteínas y activa la pepsina","Digiere proteínas, lípidos y carbohidratos","Emulsiona las grasas","Neutraliza el quimo"],"El HCl no digiere por sí mismo: activa la pepsina, que es la que digiere las proteínas."],["¿Qué es la hernia hiatal?",["Parte del estómago sube sobre el diafragma por el hiato esofágico","Una inflamación del apéndice","Una úlcera en el duodeno","Una salida del intestino por la pared del abdomen"],"El estómago se desliza hacia el tórax por el hiato esofágico del diafragma."],["¿Dónde ocurre la mayor absorción de nutrientes?",["En el intestino delgado","En el estómago","En el intestino grueso","En el esófago"],"El intestino delgado absorbe cerca del 90 % de los nutrientes."],["¿En qué orden están las partes del intestino delgado?",["Duodeno, yeyuno, íleon","Yeyuno, duodeno, íleon","Duodeno, íleon, yeyuno","Íleon, yeyuno, duodeno"],"El duodeno recibe la bilis y el jugo pancreático; el íleon termina en la válvula ileocecal."],["La glucosa entra a la célula intestinal acoplada al sodio y gastando energía. ¿Qué mecanismo es?",["Transporte activo","Difusión simple","Difusión facilitada","Ósmosis"],"El transporte activo gasta energía y usa iones acoplados."],["¿Qué es la difusión facilitada?",["El paso de moléculas específicas con ayuda de una proteína, sin gastar energía","El paso de moléculas pequeñas sin ayuda","El paso de moléculas gastando ATP","El paso de agua hacia donde hay más solutos"],"Simple: pasan solas. Facilitada: con proteína transportadora. Activo: con gasto de energía."],["¿Cuál es la función principal del intestino grueso?",["Absorber agua y formar las heces","Absorber la mayoría de los nutrientes","Producir bilis","Digerir proteínas"],"Además aloja a las bacterias que fermentan lo que queda."],["¿Qué vitaminas producen las bacterias del intestino grueso?",["B y K","A y D","C y E","D y K"],"Las bacterias intestinales sintetizan vitaminas B y K."],["¿Por qué el intestino grueso no hace digestión química propia?",["Porque solo secreta moco; el trabajo lo hacen sus bacterias","Porque no le llega alimento","Porque no tiene músculo","Porque absorbe todas las enzimas"],"Sus glándulas no secretan enzimas. Las bacterias fermentan y producen gases (hidrógeno, metano y CO₂)."],["¿Qué producto de la bilirrubina da el color a las heces?",["La estercobilina","La bilis","La hemoglobina","El escatol"],"Las bacterias transforman la bilirrubina en estercobilina, de color café."],["¿Qué enzima rompe el almidón?",["La amilasa","La lipasa","La proteasa","La nucleasa"],"Amilasa: almidón. Lipasa: lípidos. Proteasa: proteínas. Nucleasa: ADN y ARN."],["¿Qué enzima rompe los enlaces peptídicos de las proteínas?",["La proteasa (peptidasa)","La amilasa","La lipasa","La nucleasa"],"Las proteasas o peptidasas cortan las proteínas en péptidos y aminoácidos."],["¿Qué degrada la nucleasa?",["Ácidos nucleicos (ADN y ARN)","Almidón","Lípidos","Proteínas"],"Nucleasa: ácidos nucleicos."],["¿Qué hace la bilis?",["Emulsiona las grasas: las parte en gotitas","Rompe químicamente las proteínas","Baja la glucosa en sangre","Absorbe agua"],"La bilis no es una enzima: solo separa la grasa para que la lipasa la digiera mejor."],["¿Qué órgano produce la bilis y cuál la almacena?",["La produce el hígado y la almacena la vesícula biliar","La produce la vesícula y la almacena el hígado","La produce el páncreas y la almacena el duodeno","La produce el estómago y la almacena el hígado"],"El hígado la fabrica; la vesícula la guarda y la concentra."],["Además de enzimas, ¿qué hormonas libera el páncreas?",["Insulina y glucagón","Aldosterona y ADH","Gastrina y secretina","Bilis y amilasa"],"La insulina baja la glucosa en sangre y el glucagón la sube."],["Si baja mucho la glucosa en sangre, ¿qué hormona actúa y qué hace?",["Glucagón: hace que el hígado libere glucosa","Insulina: hace que las células tomen glucosa","Amilasa: rompe almidón","Bilis: libera glucosa del hígado"],"Glucosa baja: glucagón. Glucosa alta: insulina."],["¿Cuál es el producto de la digestión?",["Moléculas absorbibles: monosacáridos, aminoácidos, ácidos grasos y nucleótidos","Hidrógeno, metano y CO₂","Quimo y heces","Bilis y jugo pancreático"],"Los gases son producto de las bacterias del intestino grueso. El cuestionario del grupo los pone como respuesta; conviene mencionar las dos cosas."],["¿Cuál esfínter del tubo digestivo es voluntario?",["El anal externo","El anal interno","El pilórico","El esofágico inferior"],"El anal externo es de músculo esquelético; los demás son de músculo liso."],["¿Cómo colabora el aparato digestivo con el sistema óseo?",["Absorbe el calcio y el fósforo de la dieta","Produce médula ósea","Elimina el calcio sobrante","Produce osteoblastos"],"El calcio y el fósforo absorbidos en el intestino delgado forman la matriz ósea."]]},"uri":{"title":"Urinario","unit":"Unidad 7","qs":[["¿Cuáles son las partes del sistema urinario?",["2 riñones, 2 uréteres, vejiga y uretra","1 riñón, 2 uréteres, vejiga y uretra","2 riñones, 1 uréter, vejiga y 2 uretras","2 riñones, 2 glándulas suprarrenales y vejiga"],"Las glándulas suprarrenales están encima de los riñones, pero son del sistema endocrino."],["¿Qué estructura lleva la orina del riñón a la vejiga?",["El uréter","La uretra","El túbulo colector","La arteria renal"],"Uréter: del riñón a la vejiga. Uretra: de la vejiga al exterior."],["¿Qué estructura saca la orina de la vejiga al exterior?",["La uretra","El uréter","La pelvis renal","El conducto colector"],"La uretra es la salida; no la confundas con el uréter."],["¿Cuál es la función de la vejiga?",["Almacenar la orina","Filtrar la sangre","Formar la orina","Reabsorber agua"],"La vejiga solo guarda la orina hasta la micción."],["¿Cuál es la unidad estructural y funcional del riñón?",["La nefrona","El glomérulo","El alvéolo","El uréter"],"La nefrona filtra la sangre y forma la orina. El glomérulo es solo una parte de ella."],["¿En qué parte de la nefrona se filtra la sangre?",["En el glomérulo, dentro de la cápsula de Bowman","En el asa de Henle","En el túbulo contorneado distal","En el conducto colector"],"El glomérulo es un ovillo de capilares; lo filtrado cae en la cápsula de Bowman."],["¿Dónde se reabsorbe la mayor parte del agua, la glucosa y los aminoácidos?",["En el túbulo contorneado proximal","En el túbulo contorneado distal","En el tubo colector","En la vejiga"],"El túbulo proximal recupera la mayor parte de lo filtrado."],["¿Qué hormona aumenta la reabsorción de sodio en el túbulo distal y los conductos colectores?",["La aldosterona","La insulina","La eritropoyetina","El péptido natriurético auricular"],"Al reabsorber sodio, el agua lo sigue por ósmosis y se retiene líquido."],["«La región más superficial del interior del riñón es la médula renal.»",["Falso","Verdadero"],"Falso. La región más superficial es la corteza; la médula está por dentro."],["«Al formarse orina diluida, la osmolaridad aumenta en la rama descendente del asa de Henle, disminuye en la ascendente y sigue bajando en el resto de la nefrona.»",["Verdadero","Falso"],"Verdadero. En la descendente sale agua (se concentra); en la ascendente salen solutos (se diluye)."],["El paso de sustancias del túbulo de regreso a la sangre se llama:",["Reabsorción","Filtración","Secreción","Excreción"],"Filtración: de la sangre a la cápsula. Reabsorción: del túbulo a la sangre. Secreción: de la sangre al túbulo."],["¿Cuál es la función principal del sistema urinario relacionada con la ósmosis?",["Regular el agua y los iones de sodio y potasio","Producir glóbulos rojos","Eliminar CO₂","Absorber nutrientes"],"El riñón reabsorbe sodio y el agua lo sigue por ósmosis."],["¿Cuánto miden la uretra femenina y la masculina?",["Femenina 3 a 4 cm; masculina 18 a 20 cm","Femenina 18 a 20 cm; masculina 3 a 4 cm","Las dos miden unos 10 cm","Femenina 8 cm; masculina 12 cm"],"La femenina es mucho más corta."],["¿Por qué las mujeres tienen más infecciones urinarias?",["Porque su uretra es más corta","Porque su vejiga es más pequeña","Porque tienen un solo uréter","Porque producen más orina"],"Con una uretra de 3 a 4 cm las bacterias llegan más fácil a la vejiga."],["¿Qué transporta la uretra masculina?",["Orina y semen","Solo orina","Solo semen","Orina y bilis"],"La masculina tiene función urinaria y reproductora; la femenina solo transporta orina."],["¿En qué porciones se divide la uretra masculina?",["Prostática, membranosa y esponjosa","Proximal, media y distal","Cortical y medular","Ascendente y descendente"],"Prostática, membranosa y esponjosa."],["¿Qué es la micción?",["La expulsión de la orina de la vejiga por la uretra","La formación de la orina en la nefrona","La filtración de la sangre en el glomérulo","El paso de la orina por el uréter"],"Micción es el acto de orinar."],["En el reflejo miccional, ¿a dónde envían la señal los receptores de estiramiento de la vejiga?",["A la médula espinal sacra","Al bulbo raquídeo","Al riñón","Al cerebelo"],"La médula sacra activa la respuesta parasimpática que contrae la vejiga."],["¿Qué músculo de la vejiga se contrae para expulsar la orina?",["El detrusor","El esfínter uretral externo","El diafragma","El psoas"],"El detrusor es el músculo de la pared de la vejiga."],["¿Qué parte de la micción controlamos voluntariamente?",["La relajación del esfínter uretral externo","La contracción del detrusor","La relajación del esfínter interno","La formación de orina"],"El esfínter externo es de músculo esquelético; el interno es liso e involuntario."],["Si una persona tiene un problema del sistema urinario, ¿qué estudio se puede realizar?",["Cistoscopia","Espirometría","Electromiografía","Endoscopia digestiva"],"En la cistoscopia se introduce una cámara por la uretra para ver la vejiga."],["¿Qué función del sistema urinario ayuda a mantener la homeostasis?",["Regula el agua, el sodio y el potasio de la sangre","Produce calor","Absorbe nutrientes","Elimina CO₂"],"Con eso regula también la presión y el pH de la sangre."],["¿Qué pasa con la mayor parte del líquido que filtran los riñones cada día?",["Se reabsorbe y regresa a la sangre","Se elimina como orina","Se guarda en la vejiga","Se evapora por los pulmones"],"Se filtran unos 180 L al día y solo se orinan 1 a 2 L."],["¿Qué diferencia hay entre el esfínter uretral interno y el externo?",["El interno es involuntario y el externo voluntario","El interno es voluntario y el externo involuntario","Los dos son voluntarios","Los dos son involuntarios"],"Interno: músculo liso. Externo: músculo esquelético."]]},"hue":{"title":"Huesos","unit":"Unidad 8","qs":[["¿Cuántos huesos tiene el adulto y cómo se reparten?",["206: 80 axiales y 126 apendiculares","206: 126 axiales y 80 apendiculares","270: 80 axiales y 190 apendiculares","212: 100 axiales y 112 apendiculares"],"Axial: cabeza, columna y tórax. Apendicular: cinturas y extremidades."],["¿Por qué un niño tiene más huesos que un adulto?",["Porque algunos huesos se fusionan al crecer","Porque los adultos pierden huesos con la edad","Porque los huesos del niño son de cartílago","No es cierto: tienen los mismos"],"El recién nacido tiene unos 270; varios se fusionan hasta quedar 206."],["¿Qué médula ósea produce las células sanguíneas?",["La médula ósea roja","La médula ósea amarilla","La médula espinal","La médula renal"],"La roja hace la hematopoyesis; la amarilla almacena triglicéridos."],["¿Cuál de estas NO es función del sistema óseo?",["Producir calor","Almacenar y liberar minerales","Proteger órganos","Producir células sanguíneas"],"Producir calor es función de los músculos."],["¿Cómo se llama el cuerpo (la parte larga) de un hueso largo?",["Diáfisis","Epífisis","Metáfisis","Periostio"],"Diáfisis: cuerpo. Epífisis: extremos. Metáfisis: entre las dos."],["¿Dónde está la placa de crecimiento de un hueso largo?",["En la metáfisis","En la diáfisis","En el periostio","En la cavidad medular"],"En los niños la metáfisis tiene la placa epifisaria, donde el hueso crece en longitud."],["¿Qué es el periostio?",["La membrana que cubre el hueso por fuera","El hueco de la diáfisis","El cartílago de la epífisis","El extremo del hueso"],"Nutre el hueso, ayuda a repararlo y es donde se insertan tendones y ligamentos."],["¿Qué célula forma la matriz ósea?",["El osteoblasto","El osteoclasto","El osteocito","La célula osteogénica"],"Blasto: construye. Clasto: destruye. El osteocito mantiene."],["¿Qué célula se encarga de reabsorber (destruir) la matriz ósea?",["El osteoclasto","El osteoblasto","El osteocito","El fibroblasto"],"El osteoclasto reabsorbe hueso y libera calcio a la sangre."],["¿Qué célula madura mantiene el tejido óseo?",["El osteocito","El osteoblasto","El osteoclasto","La célula osteogénica"],"El osteocito es un osteoblasto que quedó atrapado en la matriz."],["¿Por qué se dice que el hueso es una estructura viva?",["Tiene células, vasos sanguíneos y se remodela y repara","Porque es duro","Porque contiene calcio","Porque no cambia con el tiempo"],"Sus células forman, mantienen y destruyen hueso todo el tiempo, y recibe sangre por arterias nutricias."],["El hueso sale a través de la piel. ¿Qué fractura es?",["Expuesta","Conminuta","Impactada","En tallo verde"],"Expuesta: el hueso queda expuesto al exterior."],["El hueso queda astillado en muchas partes. ¿Qué fractura es?",["Conminuta","Expuesta","Impactada","De Pott"],"Conminuta: muchos fragmentos."],["Un extremo del hueso queda encajado dentro del otro. ¿Qué fractura es?",["Impactada","Conminuta","En tallo verde","Expuesta"],"Impactada: el hueso se traslapa sobre sí mismo."],["Fractura incompleta, muy común en niños, en la que un lado se rompe y el otro se dobla:",["En tallo verde","Impactada","De Pouteau-Colles","Conminuta"],"Como una rama verde: solo pasa en niños porque sus huesos son más flexibles."],["Fractura del extremo distal del peroné con lesión de la articulación del tobillo:",["De Pott","De Pouteau-Colles","En tallo verde","Conminuta"],"Pott: tobillo. Colles: muñeca."],["Una persona resbala, cae sobre la mano y se fractura el extremo distal del radio:",["De Pouteau-Colles","De Pott","Impactada","Expuesta"],"Pouteau-Colles: extremo distal del antebrazo."],["¿Qué tipo de hueso es la rótula?",["Sesamoideo","Plano","Corto","Irregular"],"Se forma dentro de un tendón."],["¿Cuál es un ejemplo de hueso plano?",["El esternón","El fémur","La vértebra","El trapezoide"],"Largo: fémur. Corto: trapezoide. Plano: esternón. Irregular: vértebra. Sesamoideo: rótula."],["¿Qué tipo de hueso es una vértebra?",["Irregular","Corto","Plano","Largo"],"Los irregulares tienen formas complejas."],["¿Cuántos huesos tienen el cráneo y la cara?",["Cráneo 8, cara 14","Cráneo 14, cara 8","Cráneo 6, cara 16","Cráneo 10, cara 12"],"Cráneo: frontal, 2 parietales, 2 temporales, occipital, esfenoides y etmoides."],["¿Cuáles huesos del cráneo son pares?",["Parietales y temporales","Frontal y occipital","Esfenoides y etmoides","Temporales y esfenoides"],"Frontal, occipital, esfenoides y etmoides son únicos."],["¿Cuáles huesos de la cara son únicos?",["El vómer y la mandíbula","Los nasales y los lagrimales","Los maxilares y los cigomáticos","Los palatinos y los cornetes inferiores"],"En la cara hay 6 pares y 2 únicos."],["¿Cuál es el único hueso móvil de la cabeza?",["La mandíbula","El maxilar","El temporal","El cigomático"],"Sin contar los huesecillos del oído."],["¿Para qué sirven los senos paranasales?",["Aligeran el cráneo y dan resonancia a la voz","Producen células sanguíneas","Dejan pasar nervios y vasos","Unen los huesos del cráneo"],"Son cavidades con aire en los huesos frontal, esfenoides, etmoides y maxilares."],["¿Qué son los forámenes?",["Orificios que dejan pasar vasos, nervios o ligamentos","Cavidades llenas de aire","Uniones entre huesos del cráneo","Salientes donde se insertan músculos"],"Por ejemplo, por el foramen magno pasa el bulbo raquídeo."],["¿Cuáles son las costillas flotantes?",["Los pares 11 y 12","Los pares 1 a 7","Los pares 8 a 10","Los pares 8 a 12"],"Las flotantes no llegan al esternón. Todas se unen a las vértebras torácicas."],["¿Cuántos pares de costillas hay y cuántos llegan al esternón?",["12 pares; 10 llegan y 2 son flotantes","10 pares; 8 llegan y 2 son flotantes","12 pares; 7 llegan y 5 son flotantes","14 pares; 12 llegan y 2 son flotantes"],"Los pares 1 a 7 llegan directo; los 8 a 10 por el cartílago de la costilla de arriba."],["¿Cuántas vértebras tiene cada región de la columna?",["7 cervicales, 12 torácicas y 5 lumbares","12 cervicales, 7 torácicas y 5 lumbares","7 cervicales, 5 torácicas y 12 lumbares","5 cervicales, 12 torácicas y 7 lumbares"],"Más 1 sacro y 1 cóccix. Las torácicas coinciden con los 12 pares de costillas."],["¿Qué es la osteoporosis?",["Pérdida de masa y densidad ósea","Inflamación de una articulación","Infección del hueso","Crecimiento excesivo del hueso"],"El hueso se descalcifica y se vuelve frágil."],["¿Cuál es el hueso más pequeño del cuerpo?",["El estribo","El martillo","El yunque","El pisiforme"],"Está en el oído medio y mide unos 3 mm."],["¿Qué función del sistema óseo ayuda a mantener la homeostasis?",["Almacena y libera calcio según lo necesite la sangre","Produce calor","Elimina CO₂","Absorbe nutrientes"],"Además, la médula roja produce las células sanguíneas."]]},"mus":{"title":"Músculos","unit":"Unidad 8","qs":[["¿Cuál de estas NO es función del sistema muscular?",["Producir células sanguíneas","Producir calor","Mantener la postura","Mover sustancias dentro del cuerpo"],"Las células sanguíneas las produce la médula ósea roja."],["¿Qué une el músculo al hueso?",["El tendón","El ligamento","El periostio","El cartílago"],"Los tendones unen músculo con hueso; los ligamentos, hueso con hueso."],["¿Qué tejido conectivo envuelve a cada fibra muscular?",["El endomisio","El epimisio","El perimisio","El periostio"],"Epi: todo el músculo. Peri: cada fascículo. Endo: cada fibra."],["¿Qué tejido conectivo envuelve a cada fascículo?",["El perimisio","El epimisio","El endomisio","El tendón"],"Un fascículo es un haz de fibras musculares."],["¿Qué tejido conectivo envuelve a todo el músculo?",["El epimisio","El perimisio","El endomisio","El sarcolema"],"El cuestionario del grupo lo confunde; el epimisio cubre el músculo completo."],["Ordena de mayor a menor:",["Músculo, fascículo, fibra, miofibrilla","Músculo, fibra, fascículo, miofibrilla","Fascículo, músculo, fibra, miofibrilla","Fibra, fascículo, músculo, miofibrilla"],"El músculo se divide en fascículos, estos en fibras (células) y cada fibra tiene miofibrillas."],["¿Qué tipo de músculo es estriado pero involuntario?",["El cardíaco","El esquelético","El liso","Ninguno"],"El cardíaco tiene estrías como el esquelético, pero no lo controlamos."],["¿Qué tipo de músculo es voluntario?",["El esquelético","El cardíaco","El liso","Los tres"],"El esquelético es estriado y de contracción rápida y fuerte."],["¿Cómo es el músculo liso?",["Sin estrías, involuntario y de contracción lenta","Estriado, voluntario y rápido","Estriado, involuntario y con marcapasos","Sin estrías y voluntario"],"Está en las paredes de órganos y vasos sanguíneos; resiste mucho la fatiga."],["El músculo liso cuyas fibras están conectadas y se contraen como un solo bloque es:",["Unitario","Multiunitario","Cardíaco","Peniforme"],"Ejemplos: aparato digestivo, útero, uréteres y vasos sanguíneos."],["¿Cuál es un ejemplo de músculo liso multiunitario?",["El iris del ojo","El intestino","El útero","Los uréteres"],"En el multiunitario cada fibra funciona por separado: iris, músculo ciliar y piloerectores."],["¿Cuáles son las dos proteínas que hacen la contracción?",["Actina y miosina","Troponina y tropomiosina","Titina y distrofina","Hemoglobina y mioglobina"],"La miosina jala a la actina."],["Además de actina y miosina, ¿qué proteínas participan regulando la contracción?",["Troponina y tropomiosina","Colágeno y elastina","Queratina y melanina","Insulina y glucagón"],"En reposo tapan los sitios de unión de la actina."],["¿Qué hace el calcio en la contracción muscular?",["Se une a la troponina y deja libre la actina","Rompe el ATP","Une el músculo al hueso","Produce la acetilcolina"],"Sin calcio la miosina no puede unirse a la actina."],["¿Qué pasa si se acaba el ATP en un músculo?",["La miosina no se suelta de la actina y el músculo queda rígido","El músculo se relaja por completo","Se contrae con más fuerza","Usa calcio en su lugar"],"Es lo que ocurre en el rigor mortis."],["Además de la contracción, ¿para qué más usa ATP el músculo?",["Para regresar el calcio al retículo sarcoplásmico y relajarse","Para producir acetilcolina","Para formar tendones","Para fabricar actina"],"También lo usa la bomba de sodio y potasio, que deja la fibra lista para el siguiente impulso."],["¿Qué se requiere para que haya movimiento muscular?",["Señal de una neurona, calcio, ATP, actina y miosina","Solo oxígeno y glucosa","Solo calcio y fósforo","Solo la señal nerviosa"],"El impulso nervioso libera calcio, y con ATP la miosina jala la actina."],["¿Qué disposición de fascículos tiene el deltoides?",["Multipeniforme","Fusiforme","Paralela","Circular"],"Parece muchas plumas juntas."],["Fascículos de un solo lado del tendón, como en el extensor largo de los dedos:",["Unipeniforme","Bipeniforme","Multipeniforme","Triangular"],"Uni: un lado. Bi: los dos lados."],["¿Qué músculos forman anillos alrededor de un orificio?",["Los circulares","Los triangulares","Los peniformes","Los paralelos"],"Al contraerse cierran la abertura, como el orbicular de la boca."],["Músculo grueso en medio y puntiagudo en los extremos, como el bíceps braquial:",["Fusiforme","Paralelo","Triangular","Circular"],"Otro ejemplo es el gastrocnemio."],["Músculo ancho en un extremo y angosto en el otro, como un abanico:",["Triangular","Fusiforme","Unipeniforme","Paralelo"],"Tiene bastante fuerza por la cantidad de fibras en su parte ancha."],["¿Qué significa antagonismo muscular?",["Músculos que hacen acciones opuestas sobre la misma articulación","Músculos que hacen la misma acción","Músculos que nunca se contraen","Músculos que trabajan en articulaciones distintas"],"Mientras uno se contrae (agonista), el otro se relaja (antagonista)."],["¿Cuál es un par agonista y antagonista?",["Cuádriceps e isquiotibiales","Bíceps y deltoides","Pectoral mayor y serrato anterior","Gastrocnemio y sóleo"],"El otro ejemplo clásico es bíceps y tríceps."],["¿Cuál es el músculo largo que recorre el cuello del esternón a la apófisis mastoides?",["El esternocleidomastoideo","El trapecio","El platisma","El deltoides"],"Su nombre dice dónde se inserta: esternón, clavícula y mastoides."],["¿Qué músculos cubren las costillas?",["Serrato anterior, pectoral mayor y oblicuo externo","Bíceps, tríceps y deltoides","Trapecio, glúteo mayor y sóleo","Cuádriceps, sartorio y grácil"],"Es la respuesta que da el cuestionario del grupo."],["¿A qué se debe un calambre?",["A fatiga o desequilibrio en el músculo","A una infección","A la rotura de un tendón","A la falta de hueso"],"Es una contracción involuntaria y dolorosa."],["¿Qué es la miositis?",["La inflamación del músculo por infección o causa autoinmune","Un calambre por fatiga","La rotura completa del músculo","La pérdida de masa muscular por la edad"],"El sufijo -itis significa inflamación."],["¿Cómo ayuda el sistema muscular al cardiovascular?",["El cardíaco bombea la sangre y el liso de los vasos regula la presión","Produce glóbulos rojos","Filtra la sangre","Almacena calcio"],"El músculo liso de los vasos hace vasoconstricción."],["¿Qué función tienen los músculos en el sistema tegumentario?",["Los músculos de la cara tiran de la piel y producen las expresiones faciales","Producen el sudor","Dan color a la piel","Forman el pelo"],"Se insertan en la piel de la cara."],["¿Qué relación tiene el sistema digestivo con los músculos?",["Los músculos mastican, tragan y mueven el alimento por peristalsis","Los músculos producen las enzimas","Los músculos absorben los nutrientes","No tienen relación"],"Los de la mandíbula mastican; los de la faringe y el esófago tragan."],["¿Qué función del sistema muscular ayuda a mantener la homeostasis?",["Produce calor y mantiene la temperatura corporal","Regula el pH de la sangre","Absorbe nutrientes","Filtra la sangre"],"Por ejemplo, al temblar de frío."]]}};
const OPEN={"resp":[["Indica una función del sistema respiratorio que ayuda a mantener la homeostasis.",["Elimina CO₂ y así regula el pH de la sangre.","Aporta el O₂ que las células necesitan."]],["¿Cuáles son las partes del aparato respiratorio?",["Nariz (fosas nasales)","Faringe: nasofaringe, bucofaringe y laringofaringe","Laringe","Tráquea","Bronquios","Bronquiolos","Alvéolos, rodeados de capilares, dentro de los pulmones"],"El cuestionario de la clase dice «tronco braquial»; lo correcto es bronquios."],["¿Cuál es la función del sistema respiratorio?",["Intercambio gaseoso","Regula el pH de la sangre","Contiene los receptores del olfato","Filtra el aire inspirado","Produce sonidos","Elimina un poco de agua y calor"]],["¿Dónde y cómo se lleva a cabo el intercambio gaseoso?",["Dónde: entre los alvéolos y los capilares que los rodean.","Cómo: por difusión, gracias a la diferencia de presión de cada gas; pasa de donde hay más a donde hay menos.","El O₂ pasa del alvéolo a la sangre y el CO₂ de la sangre al alvéolo."],"El cuestionario de la clase lo mezcla con la ventilación (la entrada y salida de aire). Basta con decir «por difusión, por diferencia de presiones»; no necesitas números."],["¿Cuáles son las capas de los pulmones?",["Pleura visceral: pegada al pulmón","Cavidad pleural: el espacio entre las dos, con líquido pleural","Pleura parietal: tapiza la pared interna del tórax"]],["¿Cuáles son los cuatro volúmenes pulmonares?",["Volumen corriente: el aire de una respiración normal (500 mL)","Volumen de reserva inspiratoria: el extra que puedes inspirar (3000 mL)","Volumen de reserva espiratoria: el extra que puedes espirar (1000 mL)","Volumen residual: lo que queda en los pulmones después de una espiración forzada"]],["¿Cuáles son las cuatro capacidades pulmonares y qué suma cada una?",["Capacidad inspiratoria: corriente más reserva inspiratoria","Capacidad residual funcional: reserva espiratoria más residual","Capacidad vital: reserva inspiratoria, corriente y reserva espiratoria (todo lo que puedes exhalar)","Capacidad pulmonar total: los cuatro volúmenes"],"En el cuestionario, la residual funcional dice «volumen de reserva + residual»: esa reserva es la espiratoria."],["¿Qué parte del encéfalo controla la respiración y cómo responde cuando sube el CO₂ en la sangre?",["El centro respiratorio del tronco encefálico: el bulbo raquídeo, con ayuda de la protuberancia.","Los quimiorreceptores detectan que sube el CO₂ y baja el pH. Los centrales están en el bulbo; los periféricos, en los cuerpos carotídeos y aórticos.","Avisan al centro respiratorio, que aumenta la frecuencia y la profundidad de la respiración."]]],"dig":[["Indica una función del sistema digestivo que ayuda a mantener la homeostasis.",["Aporta los nutrientes, el agua y los electrolitos que el cuerpo necesita.","Elimina los desechos que no se absorben."]],["¿Cuáles son las partes del aparato digestivo y su función?",["Tubo digestivo: boca, faringe, esófago, estómago, intestino delgado, intestino grueso, recto y ano","Órganos accesorios: dientes, lengua, glándulas salivales, hígado, vesícula y vías biliares, y páncreas","Función: digerir los alimentos, absorber los nutrientes y eliminar los desechos"]],["¿Cuáles son los dos mecanismos de la digestión y dónde ocurre cada uno?",["Mecánica y química.","Boca: mecánica (masticación) y química (la amilasa salival rompe los carbohidratos)","Faringe y esófago: solo mecánica (peristalsis)","Estómago: mecánica y química"]],["¿Cómo colabora el sistema digestivo con el esquelético para mantener la matriz ósea?",["Absorbe en el intestino delgado el calcio y las sales de fósforo de la dieta."]],["¿Qué evita que el bolo regrese al esófago, y cómo se llama el bolo dentro del estómago?",["El esfínter esofágico inferior.","En el estómago el bolo se convierte en quimo.","El HCl mata microbios, desnaturaliza las proteínas y activa la pepsina, que es la que las digiere."],"El cuestionario dice que el HCl degrada proteínas, lípidos y carbohidratos. No: solo prepara las proteínas."],["¿Dónde ocurre la mayor absorción de nutrientes y en qué partes se divide ese órgano?",["En el intestino delgado.","Se divide en duodeno, yeyuno e íleon."]],["¿Cuál es la función del intestino grueso?",["Absorbe agua y forma las heces.","Aloja bacterias que siguen degradando lo que queda del quimo."],"El cuestionario escribe «quilo»; es quimo."],["¿Qué vitaminas se sintetizan en el intestino grueso?",["B y K, gracias a las bacterias."]],["¿Cuáles son las fases de la deglución y cuál es voluntaria?",["Bucal (voluntaria): la lengua empuja el bolo hacia la bucofaringe","Faríngea (involuntaria): el paladar blando cierra la nasofaringe y la epiglotis tapa la laringe","Esofágica (involuntaria): el bolo baja al estómago por peristaltismo"]],["¿Cuál es la diferencia entre los dientes deciduos y los permanentes, y cuántos son?",["Deciduos (de leche): 20. Son 8 incisivos, 4 caninos y 8 molares","Permanentes: 32. Son 8 incisivos, 4 caninos, 8 premolares y 12 molares","Los permanentes tienen la dentina más gruesa y están más mineralizados"],"El cuestionario pone 8 caninos y 4 molares en los deciduos: está al revés."],["¿Qué es la hernia hiatal?",["Parte del estómago sube por encima del diafragma, a través del hiato esofágico."]],["¿Cuáles son los esfínteres del tubo digestivo y cuál es su función?",["Función: regular el paso del alimento y evitar que regrese.","Esofágico superior e inferior","Pilórico: entre el estómago y el duodeno","Válvula ileocecal: entre el íleon y el intestino grueso","Anal interno (involuntario) y anal externo (voluntario)"]],["¿Por qué mecanismos pasan los nutrientes a las células del intestino?",["Difusión simple: pasan moléculas pequeñas, sin ayuda","Difusión facilitada: pasan moléculas específicas con una proteína transportadora","Transporte activo: gasta energía y usa iones acoplados para moléculas más complejas"]],["Asocia cada enzima con lo que degrada: amilasa, lipasa, nucleasa y proteasa.",["Amilasa: almidón","Lipasa: lípidos","Nucleasa: ácidos nucleicos (ADN y ARN)","Proteasa o peptidasa: los enlaces peptídicos de las proteínas"]],["¿Cuál es la función del páncreas?",["Secreta jugo pancreático, con enzimas que digieren los alimentos en el intestino delgado.","Libera insulina: baja la glucosa en sangre porque las células la toman.","Libera glucagón: hace que el hígado libere glucosa cuando está baja."]],["¿Cuál es la función del hígado en la digestión?",["Produce la bilis, que emulsiona las grasas: las parte en gotitas para que la lipasa las digiera."],"El cuestionario dice «para descomponer grasas». La bilis no las digiere; las emulsiona."],["¿Cuál es el producto de la digestión?",["Moléculas que se pueden absorber: monosacáridos, aminoácidos, ácidos grasos y nucleótidos.","El cuestionario de la clase responde: hidrógeno, metano y CO₂, que son los gases que producen las bacterias del intestino grueso."],"Si te lo preguntan, menciona las dos cosas para ir a la segura."],["¿Qué producto de la degradación de la bilirrubina da el color a las heces?",["La estercobilina."]]],"uri":[["Indica una función del sistema urinario que ayuda a mantener la homeostasis.",["Regula el agua y los iones (sodio y potasio) de la sangre.","Con eso ayuda a regular la presión y el pH, y elimina desechos."]],["¿Cuáles son las partes del sistema urinario y su función?",["2 riñones: filtran la sangre y forman la orina","2 uréteres: llevan la orina a la vejiga","Vejiga: almacena la orina","Uretra: la saca al exterior","Función general: filtrar la sangre y reabsorber el agua y los solutos útiles"]],["¿Cuál es la función principal del sistema urinario relacionada con la ósmosis?",["Regular los iones de sodio y potasio y, con ellos, el agua: el agua sigue al sodio por ósmosis."]],["¿Qué diferencias hay entre el aparato urinario femenino y el masculino?",["Longitud de la uretra: la femenina mide 3 a 4 cm; la masculina, 18 a 20 cm","La femenina solo transporta orina; la masculina, orina y semen","La masculina se divide en prostática, membranosa y esponjosa","La femenina, por ser más corta, tiene más riesgo de infecciones urinarias"],"El cuestionario dice «longitud del uréter»; es la uretra."],["Si una persona tiene un problema del sistema urinario, ¿qué estudio se puede realizar?",["Una cistoscopia."]],["¿Verdadero o falso? La región más superficial del interior del riñón es la médula renal.",["Falso. La más superficial es la corteza; la médula está por dentro."]],["¿Verdadero o falso? Al formarse orina diluida, la osmolaridad aumenta en la rama descendente del asa de Henle, disminuye en la ascendente y sigue bajando en el resto de la nefrona y el túbulo colector.",["Verdadero."]],["¿Cuál es la unidad estructural y funcional del riñón?",["La nefrona: filtra la sangre y forma la orina."]],["¿En qué parte de la nefrona se reabsorbe la mayor parte del agua, la glucosa y los aminoácidos?",["En el túbulo contorneado proximal."]],["¿Qué hormona aumenta la reabsorción de sodio en el túbulo distal y los conductos colectores?",["La aldosterona. Al reabsorber sodio también se retiene agua."]],["¿Qué es la micción y cómo se produce el reflejo miccional?",["Micción: la vejiga expulsa la orina al exterior por la uretra.","La vejiga se llena y su pared se estira.","Los receptores de estiramiento mandan impulsos a la médula espinal sacra.","Respuesta parasimpática: el músculo detrusor se contrae.","Al relajar voluntariamente el esfínter uretral externo, sale la orina.","El encéfalo permite facilitarla o retrasarla."]]],"hue":[["Indica una función del sistema óseo que ayuda a mantener la homeostasis.",["Almacena y libera calcio y fósforo según lo necesite la sangre.","La médula ósea roja produce las células sanguíneas."]],["¿Cuáles son las partes del sistema óseo y sus funciones?",["Esqueleto axial (cabeza, columna y tórax) y apendicular (cinturas y extremidades)","Funciones: sostén, protección, almacenamiento y liberación de minerales, hematopoyesis (médula roja) y almacenamiento de triglicéridos (médula amarilla)"]],["¿Los adultos tienen la misma cantidad de huesos que los niños?",["No. Algunos huesos se fusionan al crecer, así que el número se reduce."]],["¿Cuántos huesos tiene el adulto y cómo se reparten?",["206: 80 en el esqueleto axial y 126 en el apendicular."]],["Menciona las partes de un hueso largo.",["Diáfisis: el cuerpo","Epífisis: los extremos","Metáfisis: entre las dos; ahí está la placa de crecimiento","Cartílago articular, periostio y cavidad medular"]],["¿El hueso es una estructura viva? ¿Por qué?",["Sí. Tiene células que forman, mantienen y destruyen hueso.","Está irrigado por arterias nutricias que lo oxigenan.","Produce células sanguíneas y almacena grasa."]],["¿Cuáles son las células del hueso y qué hace cada una?",["Osteogénica: la precursora","Osteoblasto: secreta y forma la matriz","Osteocito: célula madura que mantiene el tejido; viene del osteoblasto","Osteoclasto: reabsorbe y destruye la matriz; tiene varios núcleos"],"El osteoclasto tiene varios núcleos porque se forma al fusionarse varios monocitos, no por «recoger desechos»."],["Describe los seis tipos de fractura.",["Expuesta: el hueso queda expuesto al exterior","Conminuta: astillado en muchas partes","Impactada: el hueso se traslapa sobre sí mismo","Tallo verde: incompleta, un lado se rompe y el otro se dobla; común en niños","Pott: en el extremo distal del peroné, con lesión grave del tobillo","Pouteau-Colles: en el extremo distal del antebrazo (radio), al caer sobre la mano"],"El cuestionario describe la de tallo verde como «se rompe el peroné y no la tibia»; no es eso."],["¿Cuáles son los cinco tipos de hueso por su forma? Da un ejemplo de cada uno.",["Largo: fémur","Corto: trapezoide","Plano: esternón","Irregular: vértebra","Sesamoideo: rótula"]],["Menciona los huesos de la cabeza.",["Cráneo (8): frontal, 2 parietales, 2 temporales, occipital, esfenoides y etmoides","Cara (14): 2 nasales, 2 maxilares, 2 cigomáticos, 2 lagrimales, 2 palatinos, 2 cornetes inferiores, vómer y mandíbula"]],["¿Cuál es la función de los senos paranasales?",["Aligeran el peso del cráneo y dan resonancia a la voz."],"El cuestionario dice «cavidades nasales: regular el peso»; se refiere a los senos paranasales."],["¿Cuál es la función de los forámenes?",["Son orificios que dejan pasar vasos sanguíneos, nervios o ligamentos."]],["¿Cuál es la diferencia entre una costilla fija y una flotante?",["Hay 12 pares y todas se unen a las vértebras torácicas (T1 a T12).","10 pares llegan al esternón, aunque no todas directamente.","Los pares 11 y 12 son flotantes: no llegan al esternón."]],["Indica los huesos de la columna vertebral, con número y nombre.",["7 vértebras cervicales","12 vértebras torácicas","5 vértebras lumbares","1 sacro","1 cóccix"]],["¿Cómo mantiene el equilibrio el sistema óseo?",["Con tres mecanismos: soporte y palanca, amortiguación y anclaje."]],["¿Qué es la osteoporosis?",["La descalcificación de los huesos: pierden densidad y se vuelven frágiles."]],["¿Cuál es el hueso más pequeño del cuerpo?",["El estribo (3 mm), en el oído."]]],"mus":[["Indica una función del sistema muscular que ayuda a mantener la homeostasis.",["Produce calor (termogénesis) y así mantiene la temperatura corporal.","También ayuda al control de la glucosa."]],["¿Cuáles son las partes del sistema muscular y sus funciones?",["Entre 600 y 840 músculos.","Funciones: movimiento, estabilidad, termogénesis, recubrimiento y control glucémico."]],["¿Cuáles son las estructuras generales de un músculo?",["El músculo se une al hueso por los tendones.","Epimisio: envuelve todo el músculo","Perimisio: envuelve cada fascículo","Endomisio: envuelve cada fibra muscular","Orden: músculo, fascículo, fibra muscular"],"El cuestionario dice que el epimisio recubre cada fibra; esa capa es el endomisio."],["¿Cuáles son los tipos de músculo y sus características?",["Esquelético: estriado y voluntario; acciones rápidas y con fuerza","Cardíaco: estriado pero involuntario; bombea la sangre","Liso: involuntario, de contracción lenta y resistente a la fatiga; en órganos y vasos","Liso unitario: fibras conectadas que funcionan como un bloque (aparato digestivo, útero, uréteres, vasos)","Liso multiunitario: cada fibra funciona por separado (iris, músculo ciliar, piloerectores)"]],["¿Cuáles son las dos proteínas que permiten la contracción?",["Actina y miosina."]],["¿Qué se requiere para que haya movimiento muscular?",["La neurona y su impulso nervioso","Calcio","ATP","Las proteínas actina y miosina"]],["Describe las disposiciones de los fascículos.",["Fusiforme: grueso en medio y puntiagudo en los extremos (bíceps braquial, gastrocnemio)","Paralelo: ancho uniforme; más largo pero con menos fuerza","Triangular: en abanico, ancho en un extremo y estrecho en el otro","Peniforme: unipeniforme (un lado del tendón), bipeniforme (dos lados) y multipeniforme (muchas plumas)","Circular: anillos alrededor de una abertura"]],["¿Qué disposición parece muchas plumas juntas, y cuál queda de un solo lado del tendón? Da un ejemplo de cada una.",["Multipeniforme: el deltoides","Unipeniforme: el extensor largo de los dedos"]],["¿Cuál es el músculo más largo que rodea el cuello?",["El esternocleidomastoideo."]],["¿Cuáles son los músculos que cubren las costillas?",["Serrato anterior, pectoral mayor y oblicuo externo."]],["¿Qué significa antagonismo muscular? Da dos ejemplos de parejas.",["Es la relación entre músculos que hacen acciones opuestas sobre una misma articulación.","Bíceps y tríceps","Cuádriceps e isquiotibiales"]],["¿A qué se debe un calambre?",["A fatiga o desequilibrio en el músculo."]],["¿Qué relación tiene el sistema digestivo con los músculos?",["Necesita músculos para mover y procesar los alimentos.","Los de la mandíbula mastican; los de la faringe y el esófago tragan y transportan por peristalsis."]],["¿Qué es la miositis?",["La inflamación del tejido muscular por infecciones o causas autoinmunes."]],["¿Cómo ayuda el sistema muscular a la homeostasis del sistema cardiovascular?",["El músculo cardíaco produce los latidos del corazón.","El músculo liso de los vasos regula la presión con la vasoconstricción."]],["¿Cuál es la función de los músculos en el sistema tegumentario?",["Los músculos de la cara se insertan en la piel y, al tirar de ella, producen las expresiones faciales."]],["¿Qué función tiene el ATP en los músculos?",["Contracción: la miosina usa ATP para jalar la actina, y otro ATP la suelta (sin ATP queda pegada, como en el rigor mortis)","Relajación: una bomba usa ATP para regresar el calcio al retículo sarcoplásmico","Excitabilidad: la bomba de sodio y potasio usa ATP para dejar la fibra lista para otro impulso"]],["Además de la actina y la miosina, ¿qué proteínas participan en la contracción?",["La troponina y la tropomiosina."]]]};

const BY=Object.fromEntries(MODELS.map(m=>[m.id,m]));
const LEVELS={1:{name:'Con nombre',ask:'Copia el nombre de la parte iluminada'},
              2:{name:'Con huecos',ask:'Completa el nombre de la parte iluminada'},
              3:{name:'De memoria',ask:'¿Cómo se llama la parte iluminada?'}};

/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const NS='http://www.w3.org/2000/svg';
const KEY='atlas-a-ciegas-v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const accepts=(part,val)=>{const v=norm(val); return v!=='' && [part.n,...(part.a||[])].some(x=>norm(x)===v);};
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const figure=m=>`<svg viewBox="${m.vb}" role="img" aria-label="Esquema: ${esc(m.title)}">${m.svg}</svg>`;
let P={}; try{P=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){P={};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}};
const done=(id,lv)=>!!(P[id]&&P[id][lv]);
const nextLevel=id=>[1,2,3].find(l=>!done(id,l))||3;
function maskFor(name){
  const ch=[...name], idx=ch.map((c,i)=>/\p{L}/u.test(c)?i:-1).filter(i=>i>=0);
  const hide=new Set(shuffle(idx.slice(1)).slice(0,Math.ceil(idx.length*.5)));
  return ch.map((c,i)=>hide.has(i)?0:1);
}
function tilesHTML(name,mask){
  let i=0;
  return name.split(' ').map(w=>{const h=[...w].map(c=>{const show=!mask||mask[i]; i++; return show?`<span class="tile">${esc(c)}</span>`:`<span class="tile gap"></span>`;}).join(''); i++; return `<span class="w">${h}</span>`;}).join('');
}
